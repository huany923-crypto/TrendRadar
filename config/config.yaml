report:
  mode: "daily"    # daily日报模式，如果你想每小时推送可改 hourly（不推荐）

push_window:
  enabled: true
  time_range:
    start: "20:00"   # 晚上 8 点后才推送
    end: "22:00"     # 限制推送窗口，避免深夜发送
  once_per_day: true # 一天只推一次，防重复

channels:
  email:
    enabled: true
    subject: "热点新闻推送"

crawler:
  sources:
    - weibo
    - zhihu
    - toutiao
    - bilibili
    - baidu
